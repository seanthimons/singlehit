name: Test coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Coverage
    permissions:
      contents: read
      id-token: write
    uses: seanthimons/baseline/.github/workflows/test-coverage.yaml@e53831a23ef8f543c3fee58edd390089b0f13a27 # v1.4.0
    with:
      codecov: false
      quarto: false

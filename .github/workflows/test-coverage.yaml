name: Test coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Coverage
    permissions:
      contents: read
      id-token: write
    uses: seanthimons/baseline/.github/workflows/test-coverage.yaml@6390d0d0d52ab8eba81d81ce75215c6dd2ab377d # v2.3.0
    with:
      codecov: false
      quarto: false

name: R-CMD-check

on:
  push:
    branches: [main]
    paths-ignore:
      - "NEWS.md"
      - "**/*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "NEWS.md"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r-cmd-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  r-cmd-check:
    if: github.actor != 'github-actions[bot]'
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    runs-on: ${{ matrix.config.os }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: ubuntu-latest, r: release }
          - { os: windows-latest, r: release }
          - { os: macos-latest, r: release }

    env:
      GITHUB_PAT: ${{ github.token }}
      R_KEEP_PKG_SOURCE: yes
      R_PROFILE_USER: /dev/null

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up R
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - name: Set up pandoc
        uses: r-lib/actions/setup-pandoc@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2

      - name: Install package dependencies
        uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Check package
        uses: r-lib/actions/check-r-package@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          upload-snapshots: true

      - name: Check development-loaded mirai bootstrap
        if: runner.os == 'Windows'
        shell: Rscript {0}
        run: |
          pkgload::load_all(".", quiet = TRUE)
          stopifnot(pkgload::is_dev_package("singlehit"))
          fit <- fit_dose_response(ward_rotavirus, "beta_poisson")
          result <- bootstrap_dose_response(fit, times = 2L, seed = 42L, backend = "mirai", workers = 1L)
          stopifnot(nrow(result) == 2L, all(result$converged))

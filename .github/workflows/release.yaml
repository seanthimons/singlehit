name: Release

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/release.yaml
  workflow_dispatch:
    inputs:
      version-type:
        description: Version component to bump
        type: choice
        options: [patch, minor, major, dev]
        default: patch
      dry-run:
        description: Build and check only; do not push or publish
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  release:
    # Fork PRs cannot access RELEASE_PAT; validate the caller with lint-workflows.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Release
    permissions:
      contents: write
    uses: seanthimons/baseline/.github/workflows/release-r-package.yaml@c99a0a60eed152a08d1e34841d45573fef812af2 # v1.2.0
    with:
      version-type: ${{ inputs.version-type || 'patch' }}
      notes-mode: autonewsmd
      dry-run: ${{ github.event_name == 'pull_request' || inputs.dry-run }}
    secrets:
      RELEASE_PAT: ${{ secrets.RELEASE_PAT }}

name: Release

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/release.yaml
  workflow_dispatch:
    inputs:
      release-mode:
        description: Prepare a release PR or publish the merged version
        type: choice
        options: [prepare-pr, publish]
        default: prepare-pr
      version-type:
        description: Version component to bump during PR preparation
        type: choice
        options: [patch, minor, major, dev]
        default: patch
      dry-run:
        description: Check only; do not push, open a PR, or publish
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  release:
    # Fork PRs cannot access RELEASE_PAT; validate the caller with lint-workflows.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Release
    permissions:
      contents: write
    uses: seanthimons/baseline/.github/workflows/release-r-package.yaml@733a6e4554870ab2fa8dd7495fa67bea029bb38c # v1.3.0
    with:
      release-mode: ${{ inputs.release-mode || 'prepare-pr' }}
      version-type: ${{ inputs.version-type || 'patch' }}
      notes-mode: autonewsmd
      dry-run: ${{ github.event_name == 'pull_request' || inputs.dry-run }}
    secrets:
      RELEASE_PAT: ${{ secrets.RELEASE_PAT }}

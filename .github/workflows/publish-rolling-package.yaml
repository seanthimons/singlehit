name: Publish Rolling Package

on:
  workflow_dispatch:

permissions:
  contents: read

# The reusable workflow serializes publication by rolling tag.
jobs:
  rolling:
    name: Rolling prerelease
    permissions:
      contents: write
    uses: seanthimons/baseline/.github/workflows/rolling-prerelease.yaml@6390d0d0d52ab8eba81d81ce75215c6dd2ab377d # v2.3.0
    with:
      ref: main
      tag: package-latest
      build-binaries: false
      require-dev-version: false

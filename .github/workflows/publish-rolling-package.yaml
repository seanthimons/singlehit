name: Publish Rolling Package

on:
  workflow_dispatch:

permissions:
  contents: read

# The reusable workflow serializes publication by rolling tag.
jobs:
  rolling:
    name: Rolling prerelease
    permissions:
      contents: write
    uses: seanthimons/baseline/.github/workflows/rolling-prerelease.yaml@c99a0a60eed152a08d1e34841d45573fef812af2 # v1.2.0
    with:
      ref: main
      tag: package-latest
      build-binaries: false
      require-dev-version: false

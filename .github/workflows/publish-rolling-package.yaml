name: Publish Rolling Package

on:
  workflow_dispatch:

permissions:
  contents: read

# The reusable workflow serializes publication by rolling tag.
jobs:
  rolling:
    name: Rolling prerelease
    permissions:
      contents: write
    uses: seanthimons/baseline/.github/workflows/rolling-prerelease.yaml@067b932909c9ca4cdce189717c99a62a812d3db9 # v2.2.1
    with:
      ref: main
      tag: package-latest
      build-binaries: false
      require-dev-version: false

name: Publish Rolling Package

on:
  workflow_dispatch:

permissions:
  contents: read

# The reusable workflow serializes publication by rolling tag.
jobs:
  rolling:
    name: Rolling prerelease
    permissions:
      contents: write
    uses: seanthimons/baseline/.github/workflows/rolling-prerelease.yaml@733a6e4554870ab2fa8dd7495fa67bea029bb38c # v1.3.0
    with:
      ref: main
      tag: package-latest
      build-binaries: false
      require-dev-version: false

name: Publish Rolling Package

on:
  workflow_dispatch:

permissions:
  contents: read

# The reusable workflow serializes publication by rolling tag.
jobs:
  rolling:
    name: Rolling prerelease
    permissions:
      contents: write
    uses: seanthimons/baseline/.github/workflows/rolling-prerelease.yaml@ad7b0409c5ae8d28f293826fef0819bd74c7b9e0 # v2.2.0
    with:
      ref: main
      tag: package-latest
      build-binaries: false
      require-dev-version: false

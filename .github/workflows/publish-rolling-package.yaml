name: Publish Rolling Package

on:
  workflow_dispatch:

permissions:
  contents: read

# The reusable workflow serializes publication by rolling tag.
jobs:
  rolling:
    name: Rolling prerelease
    permissions:
      contents: write
    uses: seanthimons/baseline/.github/workflows/rolling-prerelease.yaml@e53831a23ef8f543c3fee58edd390089b0f13a27 # v1.4.0
    with:
      ref: main
      tag: package-latest
      build-binaries: false
      require-dev-version: false
